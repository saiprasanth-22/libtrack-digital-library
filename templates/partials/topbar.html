<header class="app-topbar">
  <button class="mobile-side-toggle" data-sidebar aria-label="Toggle navigation" aria-controls="app-sidebar"><i data-lucide="menu"></i></button>
  <form class="top-search" action="{% url 'core:discover' %}" method="get" role="search"><i data-lucide="search"></i><label class="visually-hidden" for="topbar-search">Search the catalogue</label><input id="topbar-search" name="q" value="{{ request.GET.q|default:'' }}" aria-label="Global search" placeholder="Search books, authors, subjects, ISBNs, or resources…"><kbd>Ctrl K</kbd></form>
  <div class="top-actions">
    {% if request.user.is_authenticated %}
      <span class="topbar-name">{{ request.user.first_name|default:request.user.username }}</span>
      <a class="mini-avatar" href="{% if request.user.is_staff %}{% url 'core:librarian' %}{% else %}{% url 'core:student' %}{% endif %}" aria-label="Go to my dashboard">{{ request.user.first_name|default:request.user.username|slice:":2"|upper }}</a>
    {% else %}
      <a href="{% url 'core:login' %}">Sign in</a>
    {% endif %}
  </div>
</header>
