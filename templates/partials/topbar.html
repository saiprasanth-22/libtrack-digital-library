<header class="app-topbar">
  <button class="mobile-side-toggle" data-sidebar aria-label="Toggle navigation"><i data-lucide="menu"></i></button>
  <form class="top-search" action="{% url 'core:discover' %}" method="get"><i data-lucide="search"></i><input name="q" aria-label="Global search" placeholder="Search books, authors, subjects, ISBNs, or resources…"><kbd>Ctrl K</kbd></form>
  <div class="top-actions">{% if request.user.is_authenticated %}<a class="mini-avatar" href="{% if request.user.is_staff %}{% url 'core:librarian' %}{% else %}{% url 'core:student' %}{% endif %}">{{ request.user.first_name|default:request.user.username|slice:":2"|upper }}</a>{% else %}<a href="{% url 'core:login' %}">Sign in</a>{% endif %}</div>
</header>
