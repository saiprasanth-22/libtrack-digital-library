{% extends "base.html" %}
{% block title %}Password updated — LibTrack{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="auth-card">
    <a class="brand auth-brand" href="{% url 'core:home' %}"><span class="brand-mark">L</span><span>LibTrack</span></a>
    <p class="app-eyebrow">ACCOUNT SECURITY</p>
    <h1 class="auth-title">Password updated.</h1>
    <p class="auth-lead">Your password has been changed and you are still signed in on this device.</p>
    <a class="button button-primary auth-submit" href="{% url 'core:student_profile' %}">Back to my profile <i data-lucide="arrow-right"></i></a>
  </section>
</main>
{% endblock %}
