{% extends "base.html" %}{% block title %}Create account — LibTrack{% endblock %}{% block content %}<main style="min-height:100vh;background:var(--ink);display:grid;place-items:center;padding:32px;color:var(--cream)"><section style="width:min(100%,560px);padding:42px;background:var(--paper);color:var(--brown);border-radius:24px;box-shadow:0 32px 90px #0007"><a class="brand" style="color:var(--brown);text-decoration:none" href="{% url 'core:home' %}"><span class="brand-mark">L</span><span>LibTrack</span></a><p class="app-eyebrow" style="margin-top:30px">STUDENT MEMBERSHIP</p><h1 style="font:46px/1 var(--serif);margin:0 0 12px">Make room to learn.</h1><p style="color:var(--muted);line-height:1.6;margin-bottom:24px">Create your account to borrow books and save resources.</p><form method="post">{% csrf_token %}<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label style="font-size:13px;font-weight:700">First name<input name="first_name" autocomplete="given-name" required value="{{ request.POST.first_name|default:'' }}" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label><label style="font-size:13px;font-weight:700">Last name<input name="last_name" autocomplete="family-name" value="{{ request.POST.last_name|default:'' }}" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label></div><label style="display:block;font-size:13px;font-weight:700;margin-top:14px">Student ID<input name="student_id" required value="{{ request.POST.student_id|default:'' }}" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label><label style="display:block;font-size:13px;font-weight:700;margin-top:14px">Department<input name="department" value="{{ request.POST.department|default:'' }}" placeholder="e.g. Computer Science" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label><label style="display:block;font-size:13px;font-weight:700;margin-top:14px">Email<input type="email" name="email" autocomplete="email" required value="{{ request.POST.email|default:'' }}" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label><label style="display:block;font-size:13px;font-weight:700;margin-top:14px">Username<input name="username" autocomplete="username" required value="{{ request.POST.username|default:'' }}" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label style="font-size:13px;font-weight:700;margin-top:14px">Password<input type="password" name="password" autocomplete="new-password" required style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label><label style="font-size:13px;font-weight:700;margin-top:14px">Confirm password<input type="password" name="password_confirm" autocomplete="new-password" required style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:13px;border:1px solid #d9d0c2;border-radius:10px"></label></div><button class="button button-primary" style="width:100%;margin-top:24px" type="submit">Create account <i data-lucide="arrow-right"></i></button></form><p style="margin-top:22px;color:var(--muted);font-size:14px">Already a member? <a href="{% url 'core:login' %}" style="color:#21775e">Sign in</a></p></section></main>{% endblock %}
